# jeno builds itself with jeno (DESIGN.md M3/M5 acceptance). The freeway jars come
# from the vendor directory — a local: Maven-layout repository whose poms are
# curated standalone manifests (no parent chain), versions re-pinned without
# the snapshot suffix. JUnit is a main dependency because JenoTestFork (part of
# jeno's production surface) compiles against the Platform API; [toolchain]
# below marks those jars as test-only for packaging, so they ship under
# lib/toolchain/ instead of being merged into the launcher jar.
# Every byte is sha256-pinned in jeno.lock.
[project]
name = "jeno"
version = "0.2.21"
main = "com.jujin.jeno.cli.Jeno"

[java]
version = 25

[limits]
max-depth = 3   # junit arrives through jupiter-engine -> platform-engine -> opentest4j

[repos]
vendor = "local:vendor"

[deps]
"com.jujin8.freeway:freeway-commons" = "vendor:2.0.2"
"com.jujin8.freeway:freeway-ioc" = "vendor:2.0.2"
"org.slf4j:slf4j-api" = "vendor:2.0.18"
"org.apiguardian:apiguardian-api" = "vendor:1.1.2"
"org.junit.jupiter:junit-jupiter-api" = "vendor:6.1.3"
"org.junit.jupiter:junit-jupiter-engine" = "vendor:6.1.3"
"org.junit.platform:junit-platform-commons" = "vendor:6.1.3"
"org.junit.platform:junit-platform-engine" = "vendor:6.1.3"
"org.junit.platform:junit-platform-launcher" = "vendor:6.1.3"

# Packaging metadata, not another dependency scope: BundleCommand omits these
# ids from the launcher jar and ships them under lib/toolchain/ with
# `jeno bundle --toolchain`. Every id must already be in the locked closure.
[toolchain]
jars = ["org.apiguardian:apiguardian-api", "org.junit.jupiter:junit-jupiter-api", "org.junit.jupiter:junit-jupiter-engine", "org.junit.platform:junit-platform-commons", "org.junit.platform:junit-platform-engine", "org.junit.platform:junit-platform-launcher", "org.opentest4j:opentest4j"]

[scripts]
bootstrap = "jeno run com.jujin.jeno.cli.Jeno"

# mj builds itself with mj (DESIGN.md M3/M5 acceptance). The freeway jars come
# from the vendor directory — a local: Maven-layout repository whose poms are
# curated standalone manifests (no parent chain), versions re-pinned without
# the snapshot suffix. The JUnit toolchain rides along for mj test.
# Every byte is sha256-pinned in mj.lock.
[project]
name = "mj"
version = "0.1.5"
main = "com.jujin.mj.cli.Mj"

[java]
version = 25

[limits]
max-depth = 3   # the junit toolchain arrives through engine -> platform-engine -> opentest4j

[repos]
vendor = "local:vendor"

[deps.vendor]
"com.jujin8.freeway:freeway-commons" = "2.0.2"
"com.jujin8.freeway:freeway-ioc" = "2.0.2"
"com.jujin8.freeway:freeway-flow" = "2.0.2"
"org.slf4j:slf4j-api" = "2.0.18"
"org.junit.jupiter:junit-jupiter-api" = "6.1.3"
"org.junit.jupiter:junit-jupiter-engine" = "6.1.3"
"org.junit.platform:junit-platform-commons" = "6.1.3"
"org.junit.platform:junit-platform-engine" = "6.1.3"
"org.junit.platform:junit-platform-launcher" = "6.1.3"

[scripts]
bootstrap = "mj run com.jujin.mj.cli.Mj"

# jeno 的自举 CI/CD(DESIGN.md §7.5)——当前树由 javac 引导后自测、自打包。
#
# 两种触发,两种职责:
#   push master   只验证:javac 引导当前树,用刚编出的 jeno 跑 lock/build/test,不发版
#   push tag v*   验证 + 发行:一致性门 → jeno bundle --toolchain → minisign 签名 → GitHub Release
#
# 版本账本是 git tags 本身:人工决定版本号(改 jeno.toml 一处,构建派生),
# tag 即发布。文档类变更不触发构建。

name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
    # 纯文档改动不占用构建分钟;tag 推送不受此过滤(GitHub 对 tag 不评估路径)
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # No install step: CI tests the code under test, not a previous release.
      # The bootstrap below compiles this tree with javac and every later step
      # runs that classpath, so a build-system change lands immediately rather
      # than one release late. A tag adds the release consistency gates and
      # bundle/release steps after this smoke baseline.
      - name: bootstrap-compile the code under test
        run: |
          CP="$(find vendor -name '*.jar' | tr '\n' ':')"
          javac -d target/classes -cp "$CP" $(find src/main/java -name '*.java')

      - name: lock (with the freshly compiled jeno)
        run: |
          CP="target/classes:$(find vendor -name '*.jar' | tr '\n' ':')"
          java -cp "$CP" com.jujin.jeno.cli.Jeno lock

      - name: build (with the freshly compiled jeno)
        run: |
          CP="target/classes:$(find vendor -name '*.jar' | tr '\n' ':')"
          java -cp "$CP" com.jujin.jeno.cli.Jeno build

      - name: test (with the freshly compiled jeno)
        run: |
          CP="target/classes:$(find vendor -name '*.jar' | tr '\n' ':')"
          java -cp "$CP" com.jujin.jeno.cli.Jeno test

      # ---- 以下仅 tag 触发:发行段 ----

      - name: verify tag matches jeno.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TOML=$(grep -m1 '^version' jeno.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG" != "$TOML" ]; then
            echo "::error::tag v$TAG does not match jeno.toml [project].version $TOML"
            exit 1
          fi

      - name: verify the built binary reports the same version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! java -cp target/classes com.jujin.jeno.cli.Jeno --version \
              | grep -q "jeno ${GITHUB_REF_NAME#v} "; then
            echo "::error::Jeno.VERSION does not match jeno.toml — bump both or neither"
            exit 1
          fi

      - name: bundle (with the freshly built jeno)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CP="target/classes:$(find vendor -name '*.jar' | tr '\n' ':')"
          java -cp "$CP" com.jujin.jeno.cli.Jeno bundle --toolchain

      - name: Release notes from the annotated tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"

      - name: Prepare the minisign key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MINISIGN_KEY_B64: ${{ secrets.JENO_MINISIGN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_KEY_B64:-}" ]; then
            echo "::error::JENO_MINISIGN_KEY repository secret is not set — sign or do not release"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y minisign
          KEY_DIR="${{ runner.temp }}/minisign"
          mkdir -p "$KEY_DIR"
          printf '%s' "$MINISIGN_KEY_B64" | base64 -d > "$KEY_DIR/jeno.key"
          chmod 600 "$KEY_DIR/jeno.key"

      - name: preserve the previous release before uploading
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API_JSON="$(mktemp)"
          API_ERR="$(mktemp)"
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
              > "$API_JSON" 2> "$API_ERR"; then
            if grep -q "HTTP 404" "$API_ERR"; then
              echo "no previous release for $GITHUB_REF_NAME — starting fresh"
              exit 0
            fi
            cat "$API_ERR" >&2
            echo "::error::could not read the previous release — refusing to delete or replace it"
            exit 1
          fi
          PREV="$RUNNER_TEMP/previous-release"
          mkdir -p "$PREV/assets"
          jq -r '.name // ""' "$API_JSON" > "$PREV/title.txt"
          jq -r '.body // ""' "$API_JSON" > "$PREV/body.md"
          jq -r '.prerelease // false' "$API_JSON" > "$PREV/prerelease.txt"
          if ! gh release download "$GITHUB_REF_NAME" --dir "$PREV/assets" --clobber; then
            echo "::error::could not save every asset of the previous release — leaving it untouched"
            exit 1
          fi
          echo "PREVIOUS_RELEASE=1" >> "$GITHUB_ENV"
          if ! gh release delete "$GITHUB_REF_NAME" --yes; then
            echo "::error::could not remove the previous release before upload"
            exit 1
          fi
          echo "PRESERVED_RELEASE=1" >> "$GITHUB_ENV"

      - name: jeno releases itself
        id: release_cmd
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          JENO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JENO_MINISIGN_KEY: ${{ runner.temp }}/minisign/jeno.key
        run: |
          echo "RELEASE_ATTEMPTED=1" >> "$GITHUB_ENV"
          CP="target/classes:$(find vendor -name '*.jar' | tr '\n' ':')"
          java -cp "$CP" com.jujin.jeno.cli.Jeno release gh:dzb/jeno-cargo \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: smoke-install the published installer
        id: smoke
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          SMOKE_HOME=$(mktemp -d)
          URL="https://github.com/dzb/jeno-cargo/releases/latest/download/install.sh"
          status=000
          for attempt in $(seq 1 12); do
            status=$(curl --max-time 60 -sSL -o "$SMOKE_HOME/install.sh" -w '%{http_code}' "$URL" || true)
            if [ "$status" = "200" ]; then
              break
            fi
            echo "installer not visible yet (HTTP $status, attempt $attempt/12) — waiting for CDN propagation"
            sleep 5
          done
          if [ "$status" != "200" ]; then
            echo "installer did not become available at $URL after 12 attempts; this is CDN propagation" >&2
            exit 1
          fi
          HOME="$SMOKE_HOME" bash "$SMOKE_HOME/install.sh"
          "$SMOKE_HOME/.jeno/bin/jeno" --version \
            | grep -q "jeno ${GITHUB_REF_NAME#v} "
          echo "smoke install from the release URL passed"

      - name: remove or restore the release after a failed publish
        if: >-
          always() && startsWith(github.ref, 'refs/tags/v') &&
          (env.RELEASE_ATTEMPTED == '1' || env.PRESERVED_RELEASE == '1') &&
          (failure() || cancelled())
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          if [ "${RELEASE_ATTEMPTED:-0}" = "1" ]; then
            gh release delete "$GITHUB_REF_NAME" --yes \
              || echo "::warning::could not delete $GITHUB_REF_NAME — continuing"
          fi
          if [ "${PREVIOUS_RELEASE:-0}" = "1" ]; then
            PREV="$RUNNER_TEMP/previous-release"
            TITLE=$(cat "$PREV/title.txt" 2>/dev/null || true)
            [ -n "$TITLE" ] || TITLE="$GITHUB_REF_NAME"
            BODY="$PREV/body.md"
            [ -f "$BODY" ] || : > "$BODY"
            shopt -s nullglob
            assets=("$PREV/assets/"*)
            args=(--title "$TITLE" --notes-file "$BODY")
            if [ "$(cat "$PREV/prerelease.txt" 2>/dev/null || echo false)" = "true" ]; then
              args+=(--prerelease)
            fi
            if gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${args[@]}"; then
              echo "restored the previous release $GITHUB_REF_NAME"
            else
              echo "::warning::could not restore $GITHUB_REF_NAME — restore it from $PREV by hand"
            fi
          fi

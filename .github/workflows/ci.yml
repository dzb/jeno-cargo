# mj 的自举 CI/CD(DESIGN.md §7.5)——上一个 release 构建下一个 release,
# 版本账本在 git tags 上:master 每落一批新提交,CI 自动把 patch 递增一并发布。
#
# 版本模型:0.1.x —— major.minor 人工维护(mj.toml),patch 只由 CI 升。
# GITHUB_TOKEN 的推送不触发新 run(GitHub 防环),所以 bump commit 不会造成循环。

name: ci

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 全量历史 + tags:版本账本在 git tags 上

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # 自举引导:装"上一个" release —— 每一版都由上一版构建(v(n) → v(n+1))。
      - name: install mj (previous release)
        run: |
          curl -fsSL https://raw.githubusercontent.com/dzb/mj-cargo/master/setup.sh | bash
          echo "$HOME/.mj/bin" >> "$GITHUB_PATH"

      - name: compute the next patch version
        run: |
          BASE=$(grep -m1 '^version' mj.toml | sed 's/.*"\([0-9]*\.[0-9]*\)\..*/\1/')
          LAST=$(git tag -l "v$BASE.*" | sed 's/.*\.//' | sort -n | tail -1)
          NEXT="$BASE.$((${LAST:-0} + 1))"
          if [ -n "$LAST" ] && git rev-parse -q --verify "v$BASE.$LAST" >/dev/null; then
            COUNT=$(git rev-list --count "v$BASE.$LAST..HEAD")
          else
            COUNT=$(git rev-list --count HEAD)
          fi
          echo "NEXT=$NEXT" >> "$GITHUB_ENV"
          echo "SHOULD_RELEASE=$([ "$COUNT" -gt 0 ] && echo true || echo false)" >> "$GITHUB_ENV"
          echo "base $BASE · last tag v$BASE.$LAST · $COUNT new commit(s) → next $NEXT"

      # 单一写点:mj.toml 与 Mj.VERSION 由同一条 sed 写出,写后断言兜底。
      - name: bump the version
        if: env.SHOULD_RELEASE == 'true'
        run: |
          sed -i "s/^version = \".*\"/version = \"$NEXT\"/" mj.toml
          sed -i "s/public static final String VERSION = \".*\";/public static final String VERSION = \"$NEXT\";/" \
            src/main/java/com/jujin/mj/cli/Mj.java
          grep -q "^version = \"$NEXT\"" mj.toml || { echo "::error::mj.toml bump failed"; exit 1; }
          grep -q "VERSION = \"$NEXT\"" src/main/java/com/jujin/mj/cli/Mj.java \
            || { echo "::error::Mj.VERSION bump failed"; exit 1; }

      # v0.1.2 起可塌缩为一步 `mj release`(前提:上一个 release 已自带该命令)。
      - name: lock
        if: env.SHOULD_RELEASE == 'true'
        run: mj lock

      - name: build
        if: env.SHOULD_RELEASE == 'true'
        run: mj build

      - name: test
        if: env.SHOULD_RELEASE == 'true'
        run: mj test

      - name: dist
        if: env.SHOULD_RELEASE == 'true'
        run: mj dist

      - name: stage the release asset (mj-bin-<version>.tar.gz)
        if: env.SHOULD_RELEASE == 'true'
        run: |
          mkdir dist-release
          cp "target/mj-$NEXT.tar.gz" "dist-release/mj-bin-$NEXT.tar.gz"

      # 次序红线:先推 bump commit,release 与 tag 在同一次 create 调用里落地
      # (tag 指向新 master HEAD,附件随 create 一次给出,无竞态窗口)。
      - name: commit the bump, push, and cut the release
        if: env.SHOULD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "mj-ci"
          git config user.email "mj-ci@users.noreply.github.com"
          git add mj.toml src/main/java/com/jujin/mj/cli/Mj.java
          git commit -m "release: v$NEXT (CI)"
          git push origin master
          gh release create "v$NEXT" "dist-release/mj-bin-$NEXT.tar.gz" \
            --target master \
            --title "mj v$NEXT" \
            --notes "modern java manager

          install:  curl -fsSL https://raw.githubusercontent.com/dzb/mj-cargo/master/setup.sh | bash
          upgrade:  mj update"

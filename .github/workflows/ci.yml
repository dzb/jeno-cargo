# mj 的自举 CI/CD(DESIGN.md §7.5)——上一个 release 构建下一个 release。
#
# 两种触发,两种职责:
#   push master   只验证:装上一个 release,构建 + 测试(狗粮常磨),不发版
#   push tag v*   验证 + 发行:一致性门 → mj dist → GitHub Release 附件
#
# 版本账本是 git tags 本身:人工决定版本号(改 mj.toml + Mj.VERSION 两处),
# tag 即发布。文档类变更不触发构建。

name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
    # 纯文档改动不占用构建分钟;tag 推送不受此过滤(GitHub 对 tag 不评估路径)
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # 自举引导:装"上一个" release —— tag 的 release 此刻尚未重建,
      # latest 指向前一版,所以每一版都由上一版构建(v(n) → v(n+1))。
      - name: install mj (latest release)
        run: |
          curl -fsSL https://raw.githubusercontent.com/dzb/mj-cargo/master/setup.sh | bash
          echo "$HOME/.mj/bin" >> "$GITHUB_PATH"

      - name: lock
        run: mj lock

      - name: build
        run: mj build

      - name: test
        run: mj test

      # ---- 以下仅 tag 触发:发行段 ----

      - name: verify tag matches mj.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TOML=$(grep -m1 '^version' mj.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG" != "$TOML" ]; then
            echo "::error::tag v$TAG does not match mj.toml [project].version $TOML"
            exit 1
          fi

      - name: verify the built binary reports the same version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! java -cp target/classes com.jujin.mj.cli.Mj --version \
              | grep -q "mj ${GITHUB_REF_NAME#v} "; then
            echo "::error::Mj.VERSION does not match mj.toml — bump both or neither"
            exit 1
          fi

      # dist is run by the JUST-BUILT mj, not the installed one. The installed
      # mj is the previous release — using it to package the current tree
      # means a change to dist itself only lands one release later (the
      # v0.1.4 artifact still had the old nine-jar layout for exactly this
      # reason). Building the release with the code under test closes that lag.
      - name: dist (with the freshly built mj)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CP="target/classes:$(find vendor -name '*.jar' | tr '\n' ':')"
          java -cp "$CP" com.jujin.mj.cli.Mj dist

      - name: stage the release asset (mj-bin-<version>.tar.gz)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir dist-release
          cp "target/mj-$VERSION.tar.gz" "dist-release/mj-bin-$VERSION.tar.gz"

      # 重发安全:先删同 tag 的旧 release(保留 tag),规避附件 CDN 缓存。
      - name: create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          ASSET="dist-release/mj-bin-${TAG#v}.tar.gz"
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes || true
          gh release create "$TAG" "$ASSET" \
            --target "$GITHUB_SHA" \
            --title "mj $TAG" \
            --notes "modern java manager

          install:  curl -fsSL https://raw.githubusercontent.com/dzb/mj-cargo/master/setup.sh | bash
          upgrade:  mj update"
